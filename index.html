<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | ULTRAKILL</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background-color: #000;
        }

        #custom-progress-container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            text-align: center;
            font-family: monospace;
            color: #ff0000;
            z-index: 10;
        }

        #custom-progress-bar-empty {
            width: 100%;
            height: 12px;
            background: #222;
            border: 2px solid #ff0000;
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        #custom-progress-bar-full {
            width: 0%;
            height: 100%;
            background: #ff0000;
            transition: width 0.1s ease;
        }

        #onscreen-error-log {
            color: #ff3333;
            background: #111;
            border: 1px dashed #ff0000;
            padding: 10px;
            font-size: 11px;
            margin-top: 15px;
            text-align: left;
            white-space: pre-wrap;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }
    </style>
</head>

<body>
    <div id="custom-progress-container">
        <div id="loading-text" style="font-size: 24px; font-weight: bold; letter-spacing: 2px;">LOADING ULTRAKILL...</div>
        <div id="custom-progress-bar-empty">
            <div id="custom-progress-bar-full"></div>
        </div>
        <div id="progress-percentage" style="font-size: 14px; margin-top: 5px;">0%</div>
        <div id="onscreen-error-log"></div>
    </div>

    <canvas id="unity-canvas" tabindex="-1" style="width: 100vw; height: 100vh; position: fixed; top: 0; left: 0;" hidden></canvas>
    <script>
        var gameCanvas = document.querySelector("#unity-canvas");
        
        // Forces Chromebook OS to prioritize the game's movement direction vectors
        window.addEventListener("keydown", function(e) {
            if(["Space", "KeyW", "KeyA", "KeyS", "KeyD"].indexOf(e.code) > -1) {
                if (gameCanvas) {
                    gameCanvas.focus();
                }
            }
        }, {passive: false});

        // Keeps your mouse cursor fully locked to the game view so turning works right
        document.addEventListener('click', function () {
            if (gameCanvas && !document.pointerLockElement) {
                gameCanvas.requestPointerLock({
                    unadjustedMovement: true 
                });
            }
        });
    </script>
    <script>
        var logBox = document.getElementById("onscreen-error-log");
        function showDiagnosticError(message) {
            logBox.style.display = "block";
            logBox.innerText += "\n» " + message;
        }
        window.onerror = function(msg, url, line) {
            showDiagnosticError(msg + " (Line " + line + ")");
            return false;
        };
        window.onunhandledrejection = function(event) {
            showDiagnosticError("Promise Rejected: " + event.reason);
        };
    </script>

    <!-- Lowercase build path to match your folder exactly -->
    <script src="build/9853637125e801e9aae48e78dbbdcfca.loader.js" onerror="showDiagnosticError('Could not find file pathway inside your lowercase build/ folder.')"></script>
    <script>
        var canvas = document.querySelector("#unity-canvas");
        var progressFull = document.querySelector("#custom-progress-bar-full");
        var progressText = document.querySelector("#progress-percentage");
        var statusLabel = document.querySelector("#loading-text");

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
        }

        canvas.hidden = false;

        if (typeof createUnityInstance === "undefined") {
            showDiagnosticError("Initialization Error: 'createUnityInstance' is missing. The engine loader script did not execute.");
        } else {
            createUnityInstance(canvas, {
                dataUrl: "build/2facc552a7176a3c4f6184e293ead869.data.unityweb",
                frameworkUrl: "build/372c51523da4553ad9ad6740d46ef615.framework.js.unityweb",
                codeUrl: "build/4316a55f7504875581587d5c75896d34.wasm.unityweb",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Hakita",
                productName: "ULTRAKILL",
                productVersion: "1.0",
                decompress: false
            }, (progress) => {
                let compilationProgress = Math.round(progress * 100);
                progressFull.style.width = compilationProgress + "%";
                progressText.innerText = compilationProgress + "%";
            }).then((e) => {
                document.querySelector("#custom-progress-container").remove();
            }).catch((err) => {
                console.error(err);
                statusLabel.innerText = "ENGINE COMPILATION ERROR!";
                showDiagnosticError(err.message || err);
            });
        }
    </script>
</body>

</html>
